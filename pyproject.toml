[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-jax-ml"
version = "0.1.0"
description = "A deep learning library built on JAX for JIT compilation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.1"
dependencies = [ 
    "jax>=0.4.0",  
    "jaxlib>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/dylanvatanapradit/dv-jax-ml"
Repository = "https://github.com/dylanvatanapradit/dv-jax-ml"

[tool.setuptools.packages.find]
where = ["src"]